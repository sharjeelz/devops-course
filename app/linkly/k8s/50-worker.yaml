apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: linkly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      securityContext:
        runAsNonRoot: true
      terminationGracePeriodSeconds: 15
      containers:
        - name: worker
          image: linkly-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: linkly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: linkly-db, key: DATABASE_URL }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
