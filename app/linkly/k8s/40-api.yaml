apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: linkly
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: linkly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres          # the API creates its table at start-up, so it needs Postgres first
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -U linkly -d linkly; do echo waiting for postgres; sleep 2; done"]
          securityContext:
            runAsUser: 70                  # the postgres image's own non-root user
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: linkly-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: linkly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: linkly-db, key: DATABASE_URL }
          ports:
            - containerPort: 8000
          readinessProbe:                  # only send traffic once it answers
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
          livenessProbe:                   # restart it if it stops answering
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          lifecycle:
            preStop:                       # keep serving while Services stop sending traffic here
              sleep: { seconds: 5 }
          securityContext:
            allowPrivilegeEscalation: false
