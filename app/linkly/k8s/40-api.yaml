apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: linkly
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: linkly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: api
          image: linkly-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: linkly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: linkly-db, key: DATABASE_URL }
          ports:
            - containerPort: 8000
          readinessProbe:                  # only send traffic once it answers
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
          livenessProbe:                   # restart it if it stops answering
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
