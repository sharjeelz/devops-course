# Production-like: GHCR images pinned to one build, three API replicas, no NodePort.
# Change newName to your own GHCR namespace and newTag to the build you want.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k8s
labels:
  - pairs:
      environment: prod
images:
  - name: linkly-api
    newName: ghcr.io/sharjeelz/linkly-api
    newTag: sha-85779b4
  - name: linkly-worker
    newName: ghcr.io/sharjeelz/linkly-worker
    newTag: sha-85779b4
  - name: linkly-web
    newName: ghcr.io/sharjeelz/linkly-web
    newTag: sha-85779b4
replicas:
  - name: api
    count: 3
patches:
  - target:
      kind: Service
      name: web
    patch: |-
      - op: replace
        path: /spec/type
        value: ClusterIP
      - op: remove
        path: /spec/ports/0/nodePort
