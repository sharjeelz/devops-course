# The lab's hosts (module 9): the names are the containers in lab/compose.yaml.
all:
  children:
    bastions:
      hosts:
        bastion:
    linkly:
      hosts:
        web1:
      vars:
        # web1 isn't reachable from where Ansible runs; SSH hops through the bastion.
        ansible_ssh_common_args: -o ProxyJump=ec2-user@bastion
