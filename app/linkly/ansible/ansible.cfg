# Ansible's settings for Linkly (module 9). Ansible reads ./ansible.cfg when you run it from this
# folder (the lab's control container points ANSIBLE_CONFIG here).
[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
# Seconds to wait for SSH (and sudo) to answer. A host's first login can be slow.
timeout = 30
# Show results as YAML, not one long JSON line.
callback_result_format = yaml

[ssh_connection]
# One SSH round trip per task instead of several. Works because ec2-user's sudo needs no TTY.
pipelining = True
