- name: Install Docker
  ansible.builtin.dnf:
    name: docker
    state: present

- name: Start Docker now and at every boot
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Create Docker's plugin folder
  ansible.builtin.file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: "0755"

- name: Install the Docker Compose plugin
  ansible.builtin.get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ ansible_facts['architecture'] }}"
    checksum: "sha256:{{ docker_compose_sha256[ansible_facts['architecture']] }}"
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    mode: "0755"

- name: Let these users run docker without sudo
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
