# A one-node kind cluster whose NodePort 30080 (Linkly's web Service) is reachable at localhost:8080.
#   kind create cluster --name linkly --config kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080              # port 8080 taken? change this one number, then recreate the cluster
        listenAddress: "127.0.0.1"  # only this machine, not your whole network
