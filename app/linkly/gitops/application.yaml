# Linkly, managed by Argo CD (module 5). It deploys the "deploy" branch: main plus which image runs
# (app/linkly/gitops/values.yaml there). CI updates that branch after every successful build of
# main; a revert there is a rollback. Change repoURL to your fork.
#   kubectl apply -f app/linkly/gitops/application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linkly
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sharjeelz/devops-course.git
    targetRevision: deploy
    path: app/linkly/helm/linkly
    helm:
      valueFiles:
        - ../../gitops/values.yaml       # relative to the chart: app/linkly/gitops/values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: linkly
  syncPolicy:
    automated:
      prune: true        # objects removed from Git are removed from the cluster
      selfHeal: true     # changes made by hand on the cluster are put back
    syncOptions:
      - CreateNamespace=true
