# Where External Secrets reads from (module 8): AWS Secrets Manager in your region. No keys here:
# the external-secrets service account gets an IAM role through EKS Pod Identity (Terraform,
# envs/eks), which may read only the database's secret.
#   sed "s/AWS_REGION/$AWS_REGION/" app/linkly/eks/cluster-secret-store.yaml | kubectl apply -f -
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: AWS_REGION
