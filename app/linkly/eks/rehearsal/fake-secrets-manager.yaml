# A stand-in for AWS Secrets Manager (kind rehearsal, module 8): External Secrets' "fake" provider
# serves the same JSON RDS keeps in Secrets Manager. The rehearsal edits it to simulate rotation.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    fake:
      data:
        - key: "rds!db-rehearsal"
          value: '{"username":"linkly","password":"p@ss:w/rd#1%+x?"}'
---
# Instead of Let's Encrypt (which needs a public name): a self-signed issuer with the same name.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  selfSigned: {}
