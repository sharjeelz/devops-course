# Linkly's Helm chart (module 4). The defaults suit a local kind cluster with images loaded as :dev.
# One Linkly per namespace: the Services keep fixed names (api, web, postgres, redis), as nginx expects.

image:
  prefix: ""                    # "" = local images (kind load); e.g. "ghcr.io/<you>/" for GHCR
  tag: dev
  pullPolicy: IfNotPresent

baseUrl: http://localhost:8080  # used to build short links

postgres:
  image: postgres:16-alpine
  user: linkly
  password: linkly              # local only. Letters, digits and _ (it goes into DATABASE_URL); the chart checks.
  database: linkly
  storage: 1Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }

redis:
  image: redis:7-alpine
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

api:
  replicas: 2                   # ignored when autoscaling is on
  autoscaling:
    enabled: false              # true: an HPA (needs metrics-server) and a PodDisruptionBudget (module 8)
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilization: 70    # percent of the CPU request
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 256Mi }

worker:
  replicas: 1
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { memory: 192Mi }

web:
  replicas: 1
  service:
    type: NodePort              # NodePort for kind (see kind-config.yaml); ClusterIP behind a Gateway
    nodePort: 30080
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { memory: 128Mi }

gateway:
  enabled: false                # true: a Gateway + HTTPRoute (needs a Gateway API implementation installed)
  className: eg
  hostname: ""                  # e.g. linkly.example.com (required with TLS)
  tls:
    enabled: false              # true: HTTPS on 443 with a cert-manager certificate, HTTP redirects (module 8)
    clusterIssuer: ""           # the cert-manager ClusterIssuer, e.g. letsencrypt

# A database outside the cluster (module 8: RDS). Instead of the postgres StatefulSet and a Secret
# from values, External Secrets builds linkly-db from a secret in AWS Secrets Manager.
externalDatabase:
  enabled: false
  host: ""                      # e.g. the RDS endpoint
  port: 5432
  database: linkly
  sslmode: require              # RDS requires TLS; the kind rehearsal uses disable
  externalSecret:
    secretStore: ""             # a ClusterSecretStore name
    remoteKey: ""               # the secret's name or ARN in Secrets Manager
    refreshInterval: 1m         # how soon a rotated password reaches the cluster
