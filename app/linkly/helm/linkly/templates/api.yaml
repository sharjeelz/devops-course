apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    {{- include "linkly.labels" . | nindent 4 }}
spec:
  selector:
    app: api
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    {{- include "linkly.labels" . | nindent 4 }}
  {{- include "linkly.reloadAnnotations" . | nindent 2 }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}  # with autoscaling on, the HPA sets this instead
  {{- end }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        {{- include "linkly.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "linkly.configChecksum" . }}
    spec:
      securityContext:
        runAsNonRoot: true
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          # The same URL the app uses, so this works for the in-cluster postgres and for RDS alike.
          command: ["sh", "-c", "until pg_isready -d \"$DATABASE_URL\"; do echo waiting for the database; sleep 2; done"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: linkly-db, key: DATABASE_URL }
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: {{ include "linkly.image" (list $ "linkly-api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: linkly-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: { name: linkly-db, key: DATABASE_URL }
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          lifecycle:
            preStop:
              sleep: { seconds: 5 }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
