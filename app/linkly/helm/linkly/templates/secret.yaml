{{- if not .Values.externalDatabase.enabled }}
{{- /*
The database credentials. They go into a URL (DATABASE_URL), so they're checked here: letters,
digits and _ only. toString matters: --set turns an all-digit password into a number.
Postgres reads them only when it first creates its data, so changing the password later through
the chart doesn't change the database's real password (that needs ALTER USER, module 8).
base64, not encryption: never put a real password in a values file (module 8).
*/ -}}
{{- $user := toString .Values.postgres.user -}}
{{- $database := toString .Values.postgres.database -}}
{{- $password := toString (required "postgres.password is required: pass one at install time, e.g. --set-string postgres.password=<letters and digits>" .Values.postgres.password) -}}
{{- range $name, $value := dict "postgres.user" $user "postgres.database" $database "postgres.password" $password }}
{{- if not (regexMatch "^[A-Za-z0-9_]+$" $value) }}
{{- fail (printf "%s may only contain letters, digits and _ (it goes into DATABASE_URL)" $name) }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: linkly-db
  labels:
    {{- include "linkly.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  POSTGRES_DB: {{ $database | quote }}
  DATABASE_URL: {{ printf "postgresql://%s:%s@postgres:5432/%s" $user $password $database | quote }}
{{- end }}
