{{- if .Values.externalDatabase.enabled }}
{{- $db := .Values.externalDatabase -}}
{{- $host := required "externalDatabase.host is required: the database's address, e.g. the RDS endpoint" $db.host -}}
{{- $store := required "externalDatabase.externalSecret.secretStore is required: the ClusterSecretStore to read from" $db.externalSecret.secretStore -}}
{{- $key := required "externalDatabase.externalSecret.remoteKey is required: the secret's name or ARN in AWS Secrets Manager" $db.externalSecret.remoteKey -}}
# The database credentials come from AWS Secrets Manager (module 8): External Secrets reads the
# secret RDS manages ({"username": ..., "password": ...}) and writes the linkly-db Secret the
# api and worker already use. No password in Git, in values, or in Helm's release history.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: linkly-db
  labels:
    {{- include "linkly.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $db.externalSecret.refreshInterval }}  # how soon a rotated password reaches the cluster
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: linkly-db
    template:
      data:
        # urlquery: a generated password may contain @ / : # % +, which would break the URL.
        DATABASE_URL: {{ printf "postgresql://{{ .username | urlquery }}:{{ .password | urlquery }}@%s:%v/%s?sslmode=%s" $host $db.port $db.database $db.sslmode | quote }}
  data:
    - secretKey: username
      remoteRef: { key: {{ $key | quote }}, property: username }
    - secretKey: password
      remoteRef: { key: {{ $key | quote }}, property: password }
{{- end }}
