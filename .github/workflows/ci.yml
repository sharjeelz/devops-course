# Linkly's pipeline (module 2): lint → test → smoke → publish.
# Runs on pull requests and on pushes to main; publishes images only on pushes (main and v* tags).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: "0.17.0"
          src: app/linkly

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: Format, validate and test Linkly's Terraform (mock AWS, no credentials)
        run: tools/check-terraform.sh

  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [api, worker]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: linkly
          POSTGRES_PASSWORD: linkly
          POSTGRES_DB: linkly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U linkly"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the test stage
        uses: docker/build-push-action@v7
        with:
          context: app/linkly/${{ matrix.service }}
          target: test
          load: true
          tags: linkly-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}-test
      - name: Run the tests (with a real Postgres for the database tests)
        run: >-
          docker run --rm --network host
          -e LINKLY_TEST_DATABASE_URL=postgresql://linkly:linkly@localhost:5432/linkly
          linkly-${{ matrix.service }}:test

  smoke:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build, start and use the whole stack
        run: app/linkly/smoke-test.sh

  kubernetes:
    needs: [lint, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        deploy: [helm, kustomize]
    steps:
      - uses: actions/checkout@v7
      - name: Install kind and Helm (pinned, checksums verified)
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind && rm kind
          curl -fsSLo helm.tar.gz https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz
          echo "86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tar.gz" | sha256sum -c -
          tar xzf helm.tar.gz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm && rm -r linux-amd64 helm.tar.gz
          kind version && helm version --short && kubectl version --client
      - name: Chart checks
        if: matrix.deploy == 'helm'
        working-directory: app/linkly
        run: |
          helm lint helm/linkly
          helm lint helm/linkly -f helm/linkly/values-prod.yaml --set image.tag=sha-test --set-string postgres.password=ci
          if helm template t helm/linkly -f helm/linkly/values-prod.yaml --set-string postgres.password=ci; then
            echo "prod values rendered without an image tag" && exit 1; fi
          if helm template t helm/linkly -f helm/linkly/values-prod.yaml --set image.tag=sha-test; then
            echo "prod values rendered without a password" && exit 1; fi
          [ "$(helm template t helm/linkly -f helm/linkly/values-prod.yaml --set image.tag=sha-test --set-string postgres.password=ci | grep -c nodePort)" = 0 ]
      - name: Deploy Linkly to a throwaway kind cluster and use it
        run: app/linkly/k8s-smoke-test.sh
        env:
          DEPLOY: ${{ matrix.deploy }}

  publish:
    needs: [smoke, kubernetes]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v7
      - name: Image name (registry names must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/linkly-${{ matrix.service }}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,priority=300
            type=raw,value=main,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: app/linkly/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write          # to push the deploy branch, and only this job
    concurrency:
      group: deploy-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Point the deploy branch at this build (Argo CD rolls it out)
        run: app/linkly/gitops/bump-image.sh "sha-${GITHUB_SHA::7}"
        env:
          SOURCE_REF: ${{ github.sha }}     # merge the commit that was built and tested, not a newer main
